modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Overthought Vehicles"
authors = "trossty"
logoFile = "assets/overthought_vehicles/icon.png"
description = '''Vehicles thought through to the last bolt: cars, bikes, boats and planes, a fuel line from well to pump, and a garage where every part wears, fails and gets fixed.'''

[[mixins]]
config = "overthought_vehicles.client.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
