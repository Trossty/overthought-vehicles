plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// One mod, one jar. The client code keeps its own folder so it is easy to see
// what never runs on a dedicated server, but NeoForge loads it from the same
// source set: the client entry point is only ever touched on Dist.CLIENT.
sourceSets {
    main {
        java.srcDir 'src/client/java'
        resources.srcDir 'src/client/resources'
    }
    gametest {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gametest

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // The real client walks through CarPhotoTest's scenes, photographs
        // them into build/run/photo/screenshots and quits. Scenes already
        // looked at are skipped: -Pcar.photo.all=true runs all of them,
        // -Pcar.photo.scenes=pumpAndLift,blockGallery just those.
        photoClient {
            client()
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('build/run/photo')
            systemProperty 'car.photo', 'true'
            systemProperty 'car.photo.all', project.findProperty('car.photo.all') ?: 'false'
            systemProperty 'car.photo.scenes', project.findProperty('car.photo.scenes') ?: ''
        }
        // Two players on a real dedicated server: mpServer, then mpAlice and
        // mpBob alongside it. The server sets the scene and quits when it is
        // done; Alice drives, Bob rides, and both photograph what they see.
        mpServer {
            server()
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('build/run/mp/server')
            programArgument '--nogui'
            systemProperty 'car.mp.server', 'true'
        }
        mpAlice {
            client()
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('build/run/mp/alice')
            programArguments.addAll '--username', 'Alice'
            systemProperty 'car.mp', 'alice'
        }
        mpBob {
            client()
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('build/run/mp/bob')
            programArguments.addAll '--username', 'Bob'
            systemProperty 'car.mp', 'bob'
        }
        // Headless server that runs every @GameTest in the mod and exits.
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

repositories {
    // Jade, compiled against but never shipped: its tooltip plugin only loads
    // when the player has Jade installed.
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    // Optional: the Jade plugin in me.trossty.car.client.compat is only
    // loaded by Jade itself, so the mod runs the same without it.
    compileOnly("maven.modrinth:jade:15.10.6+neoforge") {
        transitive = false
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// The two-player test's server starts from a fresh flat world on its own
// port, with the settings in tools/mp, every time.
tasks.matching { it.name == 'runMpServer' }.configureEach {
    doFirst {
        delete 'build/run/mp/server/world'
        copy {
            from 'tools/mp'
            into 'build/run/mp/server'
        }
    }
}
